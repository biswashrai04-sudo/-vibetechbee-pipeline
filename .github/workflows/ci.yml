name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  validate-structure:
    name: Verify Repo Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify key directories and files exist
        run: |
          test -d agents || (echo "agents/ directory missing" && exit 1)
          test -d commands || (echo "commands/ directory missing" && exit 1)
          test -f social-posting.skill.md || (echo "social-posting.skill.md missing" && exit 1)
          test -f .env.example || (echo ".env.example missing" && exit 1)
          test -f README.md || (echo "README.md missing" && exit 1)
          test -f LICENSE || (echo "LICENSE missing" && exit 1)
          test -f .gitignore || (echo ".gitignore missing" && exit 1)
          echo "✅ All required files present"

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./.brain/*" | while read f; do
            echo "Validating $f"
            python3 -m json.tool "$f" > /dev/null || exit 1
          done

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: yamllint .github/ || true

